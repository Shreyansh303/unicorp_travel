slug: 'corporate'
title: 'Corporate travel'
category: 'corporate'
order: 1
summary: 'Business travel for your company, booked within your travel policy, with help round the clock.'
intro: 'We plan and book travel for companies. You send us the request, we issue the tickets or tour orders and deliver them to the traveller with the invoices. We work within your company’s travel rules, and our team is reachable beyond office hours for emergencies.'
whatWeHandle:
  - 'Flights, hotels, trains and car rentals from one desk, with live fares and availability from the Galileo and Amadeus reservation systems'
  - 'Bookings made within your company’s travel policy and rules'
  - 'Negotiation of fares and rates with airlines, hotels and other suppliers'
  - 'Re-routing and re-issue of tickets when plans change, under the rules of the airline and others concerned'
  - 'Meet and assist at Delhi Airport for your officials'
  - 'Help beyond office hours for emergency travel needs'
  - 'Partner network across the major metro cities in India and abroad, for services in their own cities'
  - 'A dedicated team for your account, and a travel implant based at your office if you want one'
howItWorks:
  - title: 'Agree the terms'
    text: 'Share your travel policy and tell us who may send requests. We agree with you the period within which invoices are settled.'
  - title: 'You send the request'
    text: 'Your team sends each travel request to us, for flights, hotels, cars or a full trip.'
  - title: 'We issue and deliver'
    text: 'We issue the tickets or tour orders and deliver them to the traveller along with the invoices.'
  - title: 'Invoices are settled'
    text: 'You settle the invoices within the agreed period, through the payment modes you prefer.'
whoItsFor:
  - 'HR and admin teams who organise travel for staff'
  - 'Finance teams who want bookings that follow policy and are easy to reconcile'
  - 'Companies whose people travel often, to the same cities or to many'
formType: 'corporate'
image:
  src: '../../assets/photos/corporate-airport.jpg'
  alt: 'Travellers with luggage walking through a sunlit airport terminal with large glass windows'
seo:
  title: 'Corporate travel management'
  description: 'Corporate travel for companies: bookings within your policy, re-issue of tickets, airport assistance and help beyond office hours. Send an enquiry.'
