itinerary:
  - day: 1
    title: 'Fly to Paris'
    description: 'Depart from Delhi for Paris. Meet your driver on arrival and transfer to your hotel. The rest of the day is at leisure.'
  - day: 2
    title: 'Paris city tour'
    description: 'Drive past the main sights, stop at the Eiffel Tower and take an evening cruise on the Seine.'
  - day: 3
    title: 'Paris at leisure'
    description: 'A free day to visit the Louvre, walk in Montmartre or go shopping. A day trip to Versailles can be added.'
  - day: 4
    title: 'Paris to Lucerne'
    description: 'Take a morning train to Switzerland and reach Lucerne in the afternoon. Walk across the wooden Chapel Bridge and around the old town.'
  - day: 5
    title: 'Mount Titlis'
    description: 'Go up Mount Titlis by cable car for views of the snow and the glacier. Return to Lucerne for the evening.'
  - day: 6
    title: 'Lucerne to Interlaken'
    description: 'Travel by rail to Interlaken, with a stop at a viewpoint on the way. Spend the evening between the two lakes.'
  - day: 7
    title: 'Interlaken to Rome'
    description: 'Spend the morning on a boat on Lake Brienz, or on the train up to Jungfraujoch if the weather allows. Later, fly to Rome from Zurich.'
  - day: 8
    title: 'Rome sightseeing'
    description: 'With a local guide, visit the Colosseum and the Roman Forum, then the Trevi Fountain and the Spanish Steps.'
  - day: 9
    title: 'Rome and return to Delhi'
    description: 'Visit Vatican City in the morning, then transfer to the airport for your flight to Delhi.'
inclusions:
  - 'Return economy flights from Delhi, and the flight from Zurich to Rome'
