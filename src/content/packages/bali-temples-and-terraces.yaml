slug: 'bali-temples-and-terraces'
title: 'Bali temples and terraces'
summary: 'Ubud rice terraces, temples and a few easy days by the sea in Seminyak.'
type: 'international'
region: 'southeast-asia'
destinations:
  - 'Ubud'
  - 'Seminyak'
  - 'Uluwatu'
duration:
  days: 7
