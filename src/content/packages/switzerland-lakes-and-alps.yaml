itinerary:
  - day: 1
    title: 'Fly to Zurich'
    description: 'Depart from Delhi and arrive in Zurich. Transfer to your hotel and rest after the journey.'
  - day: 2
    title: 'Zurich and Lucerne'
    description: 'Spend the morning in the old town of Zurich, then take a train to Lucerne. Walk across the Chapel Bridge and along the lake.'
  - day: 3
    title: 'Mount Titlis or Rigi'
    description: 'Take a day trip to a nearby mountain by cable car or cogwheel train, depending on the weather and the season. Return to Lucerne in the evening.'
  - day: 4
    title: 'Lucerne to Interlaken'
    description: 'Take a scenic train to Interlaken, with views of lakes and green valleys. Spend the afternoon by the lakes or the river.'
  - day: 5
    title: 'Jungfrau region'
    description: 'Take a mountain railway to the high viewpoints of the Jungfrau region, with time for snow walks and photographs, if the weather allows. Tickets for this excursion are charged extra.'
  - day: 6
    title: 'Interlaken to Zermatt'
    description: 'Travel by train to Zermatt, a car-free village. Check in and walk through the village, with the Matterhorn in view on clear days.'
  - day: 7
    title: 'Zermatt'
    description: 'Take the Gornergrat railway to a viewpoint above the glaciers. The afternoon is free for a walk or a lazy meal.'
  - day: 8
    title: 'Return to Delhi'
    description: 'Travel by train to Zurich airport for the flight home.'
inclusions:
  - 'Return economy flights from Delhi, with a change of flight'
  - 'Seven nights of stay in hotels, on twin sharing'
  - 'Daily breakfast'
  - 'Swiss travel pass for trains, boats and many buses'
  - 'Excursion tickets for day 3 (Mount Titlis or Rigi) and day 7 (Gornergrat railway)'
  - 'Airport transfers in Zurich'
exclusions:
