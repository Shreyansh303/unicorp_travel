itinerary:
  - day: 1
    title: 'Arrive in Dubai'
    description: 'Fly from Delhi to Dubai. Meet your driver and transfer to your hotel. The evening is free to rest or walk along the waterfront.'
  - day: 2
    title: 'Dubai city tour'
    description: 'See the Jumeirah coast, a view of the Burj Al Arab, and the old quarter near the creek. In the evening, visit the Burj Khalifa observation deck and watch the fountain show.'
  - day: 3
    title: 'Desert safari'
    description: 'Spend the morning at leisure. In the afternoon, go dune driving and watch the sunset at a desert camp, with a barbecue dinner and a cultural show.'
  - day: 4
    title: 'Abu Dhabi day trip'
    description: 'Drive to Abu Dhabi to visit the Sheikh Zayed Grand Mosque and drive along the Corniche. Return to Dubai in the evening for a dhow cruise dinner.'
  - day: 5
    title: 'Departure from Dubai'
    description: 'Check out after breakfast and transfer to Dubai airport for your return flight.'
